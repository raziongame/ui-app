<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root { {{LIGHT_VARS}} color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { {{DARK_VARS}} color-scheme: dark; } }
:root[data-theme="dark"] { {{DARK_VARS}} color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 400 21px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  display: grid; grid-template-rows: auto 1fr; overflow: hidden;
}
button { font: inherit; color: inherit; }

/* header */
header {
  background: var(--header-bg); color: var(--header-text);
  display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--border);
}
.mark { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark img { height: 52px; width: auto; display: block; }
.mark .letter {
  width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
  background: var(--button-bg); color: var(--button-text); font-weight: 700; font-size: 22px;
}
.mark .name { font-size: 24px; font-weight: 700; white-space: nowrap; }
.mark .name .light { font-weight: 400; color: color-mix(in srgb, var(--header-text) 78%, var(--header-bg)); }
.mark .byline { font-size: 15px; opacity: .85; margin-left: 2px; white-space: nowrap; }
.spacer { flex: 1; }
.conn { display: flex; align-items: center; gap: 8px; font-size: 17px; white-space: nowrap; }
.dot { width: 11px; height: 11px; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--tick); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tick) 25%, transparent); }
.iconbtn {
  background: transparent; border: 1px solid color-mix(in srgb, var(--header-text) 35%, transparent);
  color: var(--header-text); border-radius: 10px; padding: 6px 12px; font-size: 17px; cursor: pointer;
}
.iconbtn:hover { background: color-mix(in srgb, var(--header-text) 12%, transparent); }

/* layout */
.shell { display: grid; grid-template-columns: 1fr auto; min-height: 0; }
main { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
#scroll { overflow-y: auto; }
.col { max-width: 1000px; margin: 0 auto; padding: 0 28px; }

/* empty state */
.empty { padding: 9vh 0 24px; text-align: center; }
.empty h1 { color: var(--heading); font-size: 40px; margin: 0 0 6px; }
.empty p { color: var(--muted); margin: 0 0 32px; font-size: 22px; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 12px; text-align: left; }
.chip {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px;
  font-size: 19px; cursor: pointer; text-align: left;
}
.chip:hover, .chip:focus-visible { background: var(--highlight); border-color: var(--highlight-strong, var(--tick)); outline: none; }

/* messages */
.msgs { padding: 28px 0 12px; display: flex; flex-direction: column; gap: 26px; }
.q { align-self: flex-end; max-width: 80%; background: var(--surface); border: 1px solid var(--border);
     border-radius: 18px 18px 4px 18px; padding: 12px 20px; white-space: pre-wrap; }
.a { align-self: stretch; }
.a .text p { margin: 0 0 10px; }
.a .text ul { margin: 4px 0 10px; padding-left: 1.2em; }
.a .text li { margin: 4px 0; }
.thinking { color: var(--muted); display: flex; align-items: center; gap: 12px; }
.pulse { width: 12px; height: 12px; border-radius: 50%; background: var(--tick); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: .3; transform: scale(.85) } 50% { opacity: 1; transform: scale(1) } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

table.steps { border-collapse: collapse; margin: 10px 0 8px; font-size: 18px; width: 100%; }
table.steps th { text-align: left; color: var(--heading); font-weight: 600; border-bottom: 2px solid var(--border); padding: 6px 10px 6px 0; }
table.steps td { border-bottom: 1px solid var(--border); padding: 8px 10px 8px 0; vertical-align: top; }
.tag { font-size: 14px; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; margin-left: 6px; white-space: nowrap; }
.note { color: var(--muted); font-size: 18px; }

details.how { margin-top: 8px; font-size: 17px; }
details.how summary { color: var(--link); cursor: pointer; list-style: none; display: inline-block; text-decoration: underline;
  text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--link) 45%, transparent); }
details.how summary::-webkit-details-marker { display: none; }
details.how summary:hover { text-decoration-color: var(--highlight-strong, var(--tick)); }
details.how[open] summary { margin-bottom: 6px; }
details.how .box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 18px; }
details.how ul { margin: 0; padding-left: 1.1em; }
details.how .learned { color: var(--muted); margin-top: 8px; }

/* composer */
.composer { padding: 14px 0 22px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
form { display: flex; gap: 12px; align-items: flex-end; background: var(--surface); border: 2px solid var(--border);
       border-radius: 18px; padding: 10px 10px 10px 20px; }
form:focus-within { border-color: var(--highlight-strong, var(--tick)); }
textarea { flex: 1; border: 0; outline: none; background: transparent; color: var(--text); resize: none;
           font: inherit; font-size: 22px; line-height: 1.45; max-height: 30vh; padding: 8px 0; }
textarea::placeholder { color: var(--muted); }
.send { background: var(--button-bg); color: var(--button-text); border: 0; border-radius: 12px;
        padding: 12px 22px; font-weight: 700; font-size: 20px; cursor: pointer; }
.send:hover { filter: brightness(1.08); }
.send:disabled { opacity: .5; cursor: default; }

/* sidebar */
aside { width: 340px; border-left: 1px solid var(--border); background: var(--surface); overflow-y: auto; padding: 22px 22px; }
aside[hidden] { display: none; }
aside h2 { color: var(--heading); font-size: 22px; margin: 0 0 4px; }
aside .sub { color: var(--muted); font-size: 16px; margin: 0 0 16px; }
aside ul { list-style: none; margin: 0; padding: 0; }
aside li { display: grid; grid-template-columns: 28px 1fr; gap: 4px 6px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 18px; }
aside .ok { color: var(--tick); font-weight: 700; }
aside .next { color: var(--muted); }
aside .age { grid-column: 2; color: var(--muted); font-size: 15px; }

:focus-visible { outline: 3px solid var(--highlight-strong, var(--tick)); outline-offset: 2px; }
@media (max-width: 900px) {
  body { font-size: 18px; }
  aside { position: fixed; right: 0; top: 70px; bottom: 0; width: min(340px, 90vw); z-index: 5; }
  .col { padding: 0 16px; }
  .chips { grid-template-columns: 1fr; }
  .mark .byline, .conn .label { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="mark">
    <img id="logo" alt="" hidden>
    <span class="letter" id="letter" aria-hidden="true"></span>
    <span class="name" id="bname"></span>
    <span class="byline" id="byline"></span>
  </div>
  <div class="spacer"></div>
  <div class="conn" id="conn"><span class="dot" id="dot"></span><span class="label" id="connText">Connecting…</span></div>
  <button class="iconbtn" id="learnedBtn" aria-controls="side" aria-expanded="true">What I've learned</button>
  <button class="iconbtn" id="themeBtn" title="Switch light / dark">◐</button>
</header>
<div class="shell">
  <main>
    <div id="scroll">
      <div class="col">
        <section class="empty" id="empty">
          <h1 id="hello"></h1>
          <p id="tagline"></p>
          <div class="chips" id="chips"></div>
        </section>
        <div class="msgs" id="msgs" aria-live="polite"></div>
      </div>
    </div>
    <div class="composer">
      <div class="col">
        <form id="form">
          <textarea id="q" rows="1" maxlength="2000" placeholder="Ask about your SAP system…" aria-label="Your question"></textarea>
          <button class="send" id="send" type="submit">Ask</button>
        </form>
      </div>
    </div>
  </main>
  <aside id="side" aria-label="What I've learned">
    <h2>What I've learned</h2>
    <p class="sub" id="lastLearned"></p>
    <ul id="areas"></ul>
  </aside>
</div>
<script>
"use strict";
const BRAND = {{BRAND_JSON}};
const SUGGESTIONS = [
  "What breaks if I change ZS4_IOT_DATA?",
  "Why is ZUZK900008 high risk?",
  "Why is ZUZK900006 riskier than before?",
  "What uses table ZFAKE_TABLE?",
  "What haven't you learned yet?",
  "What is the component version of SAP_BASIS?",
  "What would lower the risk of ZUZK900008?",
  "What does system monitoring show?",
  "Show me SM21 details",
];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
let busy = false;

// ---- brand ----
if (BRAND.wordmark) {
  // text logo: first part strong, the rest in a lighter weight
  $("bname").innerHTML = `${esc(BRAND.wordmark[0])}<span class="light"> ${esc(BRAND.wordmark.slice(1).join(" "))}</span>`;
} else {
  $("bname").textContent = BRAND.name;
}
$("byline").textContent = BRAND.byline || "";
$("letter").textContent = BRAND.logo_text || "";
if (!BRAND.logo_text) $("letter").hidden = true;
$("hello").textContent = BRAND.name;
$("tagline").textContent = BRAND.tagline || "";
if (BRAND.logo_image) {
  const img = $("logo");
  img.onload = () => { img.hidden = false; $("letter").hidden = true; };
  img.onerror = () => { img.hidden = true; };
  img.alt = BRAND.byline ? BRAND.byline.replace(/^by\s+/i, "") + " logo" : "";
  img.src = BRAND.logo_image;
}

// ---- theme ----
(function () {
  const saved = store.get("theme");
  if (saved) document.documentElement.dataset.theme = saved;
  $("themeBtn").onclick = () => {
    const dark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    const next = dark ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    store.set("theme", next);
  };
})();

// ---- "What I've learned" sidebar + status dot ----
(function () {
  const side = $("side"), btn = $("learnedBtn");
  const set = (open) => { side.hidden = !open; btn.setAttribute("aria-expanded", String(open)); store.set("side", open ? "open" : "closed"); };
  set(store.get("side") ? store.get("side") === "open" : innerWidth > 900);
  btn.onclick = () => set(side.hidden);
})();

async function learned() {
  try {
    const r = await (await fetch("/api/learned", {cache: "no-store"})).json();
    $("dot").className = "dot" + (r.connected ? " on" : "");
    $("connText").textContent = r.connected && r.sid ? `Connected to ${r.sid}` : "Connecting…";
    $("lastLearned").textContent = r.last_learned ? `Last learned ${r.last_learned} ago` : "";
    $("areas").innerHTML = (r.areas || []).map((a) => a.learned
      ? `<li><span class="ok" aria-label="learned">✓</span><span>${esc(a.area)}</span>${a.age ? `<span class="age">learned ${esc(a.age)} ago</span>` : ""}</li>`
      : `<li><span class="next" aria-hidden="true">○</span><span>${esc(a.area)}</span><span class="age">learning next</span></li>`).join("");
  } catch (e) {
    $("dot").className = "dot"; $("connText").textContent = "Not connected";
  }
}
learned(); setInterval(learned, 30000);

// ---- suggestions (empty chat only) ----
for (const q of SUGGESTIONS) {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.textContent = q;
  b.onclick = () => ask(q);
  $("chips").appendChild(b);
}

// ---- composer ----
const ta = $("q");
const grow = () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, innerHeight * 0.3) + "px"; };
ta.addEventListener("input", grow);
ta.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
});
$("form").onsubmit = (e) => { e.preventDefault(); const v = ta.value.trim(); if (v) ask(v); };
ta.focus();

// ---- answers ----
function formatText(text) {
  // Plain text with "- " bullet lines -> paragraphs and lists. Everything escaped.
  const out = []; let list = [];
  const flush = () => { if (list.length) { out.push("<ul>" + list.map((l) => `<li>${esc(l)}</li>`).join("") + "</ul>"); list = []; } };
  for (const raw of String(text).split("\n")) {
    const line = raw.trim();
    if (!line) { flush(); continue; }
    if (/^[-•]\s+/.test(line)) list.push(line.replace(/^[-•]\s+/, ""));
    else { flush(); out.push(`<p>${esc(line)}</p>`); }
  }
  flush();
  return out.join("");
}

function historyTable(h) {
  if (!h || !h.steps || !h.steps.length) return "";
  const rows = h.steps.map((s) => `<tr><td title="${esc(s.date_full)}">${esc(s.date)}</td>`
    + `<td>${esc(s.from)} → ${esc(s.to)}${s.older_method ? '<span class="tag">older method</span>' : ""}</td>`
    + `<td>${s.causes.map(esc).join("<br>")}</td></tr>`).join("");
  return `<table class="steps"><thead><tr><th>Date</th><th>Score</th><th>What changed</th></tr></thead><tbody>${rows}</tbody></table>`
    + (h.nothing_changed_since_last ? `<p class="note">Nothing changed since the last assessment.</p>` : "");
}

function howDoIKnow(d) {
  if (!d.sources.length && !d.learned.length) return "";
  const src = d.sources.length ? `<ul>${d.sources.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>` : "";
  const l = d.learned.length
    ? `<div class="learned">Learned: ${d.learned.map((x) => esc(x.area) + (x.age ? `, ${esc(x.age)} ago` : "")).join(" · ")}</div>` : "";
  return `<details class="how"><summary>How do I know?</summary><div class="box">${src}${l}</div></details>`;
}

function scrollDown() { const s = $("scroll"); s.scrollTop = s.scrollHeight; }

async function ask(question) {
  if (busy) return;
  busy = true; $("send").disabled = true;
  $("empty").hidden = true;
  ta.value = ""; grow();
  const q = document.createElement("div"); q.className = "q"; q.textContent = question;
  const a = document.createElement("div"); a.className = "a";
  a.innerHTML = `<div class="thinking"><span class="pulse"></span><span class="st">Thinking…</span></div>`;
  $("msgs").append(q, a); scrollDown();
  const st = a.querySelector(".st");
  try {
    const res = await fetch("/api/ask", {method: "POST", headers: {"Content-Type": "application/json"},
                                         body: JSON.stringify({question, brand: BRAND.key})});
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "", done = false;
    while (!done) {
      const r = await reader.read(); if (r.done) break;
      buf += dec.decode(r.value, {stream: true});
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 1);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === "progress") { st.textContent = ev.text + "…"; }
        else if (ev.type === "final") {
          const d = ev.data;
          a.innerHTML = `<div class="text">${formatText(d.answer)}</div>${historyTable(d.history)}${howDoIKnow(d)}`;
          done = true;
        } else if (ev.type === "error") {
          a.innerHTML = `<div class="text">${formatText(ev.message)}</div>`; done = true;
        }
      }
    }
    if (!done) a.innerHTML = `<div class="text"><p>I couldn't answer that just now. Please try again.</p></div>`;
  } catch (e) {
    a.innerHTML = `<div class="text"><p>I couldn't answer that just now. Please try again.</p></div>`;
  } finally {
    busy = false; $("send").disabled = false; scrollDown(); ta.focus();
  }
}
</script>
</body>
</html>
