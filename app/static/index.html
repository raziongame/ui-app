<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graphene</title>
<style>
/* NiraamAI colours (operator 2026-11-17): navy #003858, ocean #2A82B4, teal #1298B0, cyan #4AC2E0.
   Text pairs meet WCAG AA (tests/test_ui.py). */
:root {
  --bg: #FFFFFF; --sidebar: #F2F7FA; --text: #12232F; --muted: #4A5B68; --heading: #003858;
  --bubble: #E8F1F7; --border: #C9DCE6; --button-bg: #2A82B4; --button-text: #FFFFFF; --link: #1F6A96;
  --accent: #1298B0; --hover: #E3F5FA; --focus: #4AC2E0; --code-bg: #F2F7FA; --danger: #A12B2B;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B1C2A; --sidebar: #071521; --text: #E8F1F7; --muted: #9FB3C3; --heading: #4AC2E0;
  --bubble: #17344A; --border: #24435A; --button-bg: #4AC2E0; --button-text: #0B1C2A; --link: #4AC2E0;
  --accent: #1298B0; --hover: #132A3D; --focus: #4AC2E0; --code-bg: #132A3D; --danger: #F08A8A;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0B1C2A; --sidebar: #071521; --text: #E8F1F7; --muted: #9FB3C3; --heading: #4AC2E0;
  --bubble: #17344A; --border: #24435A; --button-bg: #4AC2E0; --button-text: #0B1C2A; --link: #4AC2E0;
  --accent: #1298B0; --hover: #132A3D; --focus: #4AC2E0; --code-bg: #132A3D; --danger: #F08A8A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 400 18px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
       display: grid; grid-template-columns: 280px 1fr; overflow: hidden; }
body.side-closed { grid-template-columns: 0 1fr; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* sidebar */
nav { background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
body.side-closed nav { border: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 8px; }
.brand img { height: 30px; width: auto; display: block; }
.brand span { font-size: 15px; font-weight: 600; color: var(--heading); }
.newchat { margin: 8px 12px 12px; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
           background: transparent; border: 1px solid var(--border); font-size: 16px; text-align: left; }
.newchat:hover { background: var(--hover); }
.history { flex: 1; overflow-y: auto; padding: 0 8px 16px; }
.group { font-size: 13px; color: var(--muted); padding: 14px 8px 4px; font-weight: 600; }
.item { display: flex; align-items: center; border-radius: 8px; }
.item:hover, .item.active { background: var(--hover); }
.item a { flex: 1; min-width: 0; padding: 8px 10px; color: var(--text); text-decoration: none; font-size: 15px;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .del { opacity: 0; background: transparent; border: 0; padding: 6px 8px; color: var(--muted); font-size: 14px; border-radius: 6px; }
.item:hover .del, .item.active .del, .item .del:focus-visible { opacity: 1; }
.item .del:hover { color: var(--danger); }

/* main */
main { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; min-height: 0; }
.top { display: flex; align-items: center; gap: 8px; padding: 10px 16px; min-height: 52px; }
.top .title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 16px; color: var(--muted); }
.icon { background: transparent; border: 0; border-radius: 8px; padding: 6px 10px; color: var(--muted); font-size: 15px; }
.icon:hover { background: var(--hover); color: var(--text); }
.icon.danger:hover { color: var(--danger); }
#scroll { overflow-y: auto; }
.col { max-width: 820px; margin: 0 auto; padding: 0 24px; }
.empty { height: 100%; display: grid; place-items: center; }
.empty h1 { font-size: 30px; font-weight: 600; color: var(--heading); margin: 0; text-align: center; padding: 0 24px; }
.msgs { display: flex; flex-direction: column; gap: 28px; padding: 16px 0 32px; }

.user { align-self: flex-end; max-width: 75%; background: var(--bubble); border-radius: 20px; padding: 10px 18px;
        white-space: pre-wrap; overflow-wrap: anywhere; }
.user.long .body { max-height: 13.5em; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, #000 75%, transparent); mask-image: linear-gradient(to bottom, #000 75%, transparent); }
.user.long.open .body { max-height: none; -webkit-mask-image: none; mask-image: none; }
.user .more { display: block; margin-top: 4px; background: transparent; border: 0; padding: 0; color: var(--link); font-size: 15px; }

.bot { overflow-wrap: anywhere; }
.bot h1, .bot h2, .bot h3, .bot h4 { color: var(--heading); line-height: 1.3; margin: 1.1em 0 .4em; }
.bot h2 { font-size: 1.3em; } .bot h3 { font-size: 1.12em; } .bot h4 { font-size: 1em; }
.bot > :first-child { margin-top: 0; }
.bot p { margin: 0 0 .8em; }
.bot ul, .bot ol { margin: 0 0 .8em; padding-left: 1.4em; }
.bot li { margin: .25em 0; }
.bot a { color: var(--link); }
.bot code { background: var(--code-bg); border-radius: 5px; padding: .1em .35em; font-size: .9em; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.bot pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: 0 0 .9em; }
.bot pre code { background: none; padding: 0; font-size: .85em; }
.bot blockquote { margin: 0 0 .8em; padding-left: 14px; border-left: 3px solid var(--accent); color: var(--muted); }
.bot hr { border: 0; border-top: 1px solid var(--border); margin: 1.2em 0; }
.bot .tbl { overflow-x: auto; margin: 0 0 .9em; }
.bot table { border-collapse: collapse; font-size: .92em; min-width: 50%; }
.bot th, .bot td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; vertical-align: top; }
.bot th { background: var(--code-bg); font-weight: 600; }
.bot.error { color: var(--muted); }
.thinking { color: var(--muted); display: flex; align-items: center; gap: 10px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
details.debug { margin-top: 10px; font-size: 13px; color: var(--muted); }
details.debug pre { white-space: pre-wrap; background: var(--code-bg); border-radius: 8px; padding: 10px; max-height: 420px; overflow: auto; }

/* composer */
.composer { padding: 8px 0 18px; }
form { display: flex; align-items: flex-end; gap: 8px; background: var(--bg); border: 1px solid var(--border);
       border-radius: 26px; padding: 8px 8px 8px 20px; box-shadow: 0 2px 10px rgba(0, 30, 50, .08); }
form:focus-within { border-color: var(--focus); }
textarea { flex: 1; border: 0; outline: none; background: transparent; color: var(--text); resize: none; font: inherit;
           line-height: 1.5; max-height: 40vh; padding: 8px 0; }
textarea::placeholder { color: var(--muted); }
/* operator 2026-11-18: only the rounded outer border highlights on focus (form:focus-within) */
textarea:focus, textarea:focus-visible { outline: none; box-shadow: none; }
.send { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--button-bg); color: var(--button-text);
        font-size: 20px; font-weight: 700; display: grid; place-items: center; flex: none; }
.send:disabled { opacity: .4; cursor: default; }
.hint { text-align: center; font-size: 13px; color: var(--muted); margin-top: 8px; }

@media (max-width: 800px) {
  body, body.side-closed { grid-template-columns: 1fr; }
  nav { position: fixed; inset: 0 auto 0 0; width: min(300px, 85vw); z-index: 10; }
  body.side-closed nav { display: none; }
  .col { padding: 0 16px; }
  .user { max-width: 88%; }
}
</style>
</head>
<body>
<nav id="side" aria-label="Chats">
  <div class="brand"><img src="/brand/logo.png" alt="NiraamAI" id="logo"><span>Graphene</span></div>
  <button class="newchat" id="newChat" type="button">＋&nbsp; New chat</button>
  <div class="history" id="history"></div>
</nav>
<main>
  <div class="top">
    <button class="icon" id="sideBtn" title="Show or hide chats" aria-controls="side">☰</button>
    <div class="title" id="title"></div>
    <button class="icon danger" id="delChat" type="button" hidden>Delete chat</button>
    <button class="icon" id="themeBtn" title="Light / dark">◐</button>
  </div>
  <div id="scroll">
    <div class="empty" id="empty"><h1>How can I help with your SAP system?</h1></div>
    <div class="col" id="conv" hidden><div class="msgs" id="msgs" aria-live="polite"></div></div>
  </div>
  <div class="composer">
    <div class="col">
      <form id="form">
        <textarea id="q" rows="1" maxlength="200000" placeholder="Message Graphene" aria-label="Message"></textarea>
        <button class="send" id="send" type="submit" title="Send" aria-label="Send">↑</button>
      </form>
      <div class="hint">Enter to send · Shift+Enter for a new line</div>
    </div>
  </div>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const DEBUG = new URLSearchParams(location.search).get("debug") === "1";
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let current = null;   // open chat id
let busy = false;

// ---------- markdown (everything escaped first; no raw HTML) ----------
function inline(s) {
  const codes = [];
  s = esc(s).replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`)
       .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
       .replace(/(^|[^\w*])\*([^*\n]+)\*(?!\w)/g, "$1<em>$2</em>")
       .replace(/(^|[^\w])_([^_\n]+)_(?!\w)/g, "$1<em>$2</em>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[+i]}</code>`);
}
function cells(line) {
  let t = line.trim(); if (t.startsWith("|")) t = t.slice(1); if (t.endsWith("|")) t = t.slice(0, -1);
  return t.split("|").map((c) => c.trim());
}
const TABLE_SEP = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
const LIST = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const BLOCK_START = /^\s*(#{1,6}\s|```|>|([-*+]|\d+[.)])\s)/;
function md(src) {
  const lines = String(src || "").replace(/\r\n?/g, "\n").split("\n");
  const out = []; let i = 0, m;
  const tableAt = (k) => lines[k].includes("|") && k + 1 < lines.length && TABLE_SEP.test(lines[k + 1]);
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {                                   // code block
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`); continue;
    }
    if (!line.trim()) { i++; continue; }
    if ((m = line.match(/^\s*(#{1,6})\s+(.*)$/))) { const n = Math.min(m[1].length + 1, 4); out.push(`<h${n}>${inline(m[2])}</h${n}>`); i++; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
    if (tableAt(i)) {                                             // table
      const head = cells(line); i += 2; const rows = [];
      while (i < lines.length && lines[i].includes("|") && lines[i].trim()) rows.push(cells(lines[i++]));
      out.push(`<div class="tbl"><table><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>`
        + rows.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("") + "</tbody></table></div>");
      continue;
    }
    if (/^\s*>/.test(line)) {                                     // quote
      const buf = []; while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
      out.push(`<blockquote>${md(buf.join("\n"))}</blockquote>`); continue;
    }
    if (LIST.test(line)) {                                        // lists, one nested level
      const html = [], stack = [];
      while (i < lines.length && (m = lines[i].match(LIST))) {
        const depth = m[1].length >= 2 ? 1 : 0, tag = /\d/.test(m[2]) ? "ol" : "ul";
        while (stack.length > depth + 1) html.push(`</li></${stack.pop()}>`);
        if (stack.length < depth + 1) { html.push(`<${tag}>`); stack.push(tag); } else html.push("</li>");
        html.push(`<li>${inline(m[3])}`); i++;
        while (i < lines.length && lines[i].trim() && !LIST.test(lines[i]) && /^\s{2,}/.test(lines[i])) html.push(" " + inline(lines[i++].trim()));
      }
      while (stack.length) html.push(`</li></${stack.pop()}>`);
      out.push(html.join("")); continue;
    }
    const buf = [line.trim()]; i++;                               // paragraph
    while (i < lines.length && lines[i].trim() && !BLOCK_START.test(lines[i]) && !tableAt(i)) buf.push(lines[i++].trim());
    out.push(`<p>${buf.map(inline).join("<br>")}</p>`);
  }
  return out.join("");
}

// ---------- rendering ----------
function scrollDown() { const s = $("scroll"); s.scrollTop = s.scrollHeight; }
function showEmpty(on) { $("empty").hidden = !on; $("conv").hidden = on; }
// Operator 2026-11-18: display only (the model gets the original text): trim leading/trailing blank
// lines and collapse 3+ blank lines into one.
function bubbleText(text) {
  return String(text).replace(/\r\n?/g, "\n").replace(/^(?:[ \t]*\n)+/, "").replace(/(?:\n[ \t]*)+$/, "")
    .replace(/\n(?:[ \t]*\n){3,}/g, "\n\n");
}
function addUser(text) {
  const d = document.createElement("div"); d.className = "user";
  const b = document.createElement("div"); b.className = "body"; b.textContent = bubbleText(text); d.appendChild(b);
  if (text.split("\n").length > 12 || text.length > 1200) {                // long paste: collapsed
    d.classList.add("long");
    const more = document.createElement("button"); more.className = "more"; more.type = "button"; more.textContent = "Show more";
    more.onclick = () => { d.classList.toggle("open"); more.textContent = d.classList.contains("open") ? "Show less" : "Show more"; };
    d.appendChild(more);
  }
  $("msgs").appendChild(d); return d;
}
function addBot(markdown, opts = {}) {
  const d = document.createElement("div"); d.className = "bot" + (opts.error ? " error" : "");
  d.innerHTML = md(markdown);
  if (DEBUG && opts.debug) {                                     // for us only: ?debug=1
    const det = document.createElement("details"); det.className = "debug";
    det.innerHTML = `<summary>debug · ${esc((opts.debug.presentation || {}).outcome || "")}</summary><pre>${esc(JSON.stringify(opts.debug, null, 2))}</pre>`;
    d.appendChild(det);
  }
  $("msgs").appendChild(d); return d;
}

// ---------- chats ----------
function groupOf(ts) {
  const d = new Date(ts * 1000), now = new Date();
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = (day(now) - day(d)) / 86400000;
  return diff < 1 ? "Today" : diff < 2 ? "Yesterday" : diff < 8 ? "Previous 7 days" : "Older";
}
function setHash(id) { history.replaceState(null, "", location.pathname + location.search + (id ? "#" + id : "")); }
async function loadHistory() {
  let chats = [];
  try { chats = (await (await fetch("/api/chats", {cache: "no-store"})).json()).chats || []; } catch (e) {}
  const h = $("history"); h.innerHTML = ""; let last = null;
  for (const c of chats) {
    const g = groupOf(c.updated);
    if (g !== last) { const gd = document.createElement("div"); gd.className = "group"; gd.textContent = g; h.appendChild(gd); last = g; }
    const it = document.createElement("div"); it.className = "item" + (c.id === current ? " active" : "");
    const a = document.createElement("a"); a.href = "#" + c.id; a.textContent = c.title; a.title = c.title;
    a.onclick = (e) => { e.preventDefault(); openChat(c.id); };
    const del = document.createElement("button"); del.className = "del"; del.type = "button"; del.textContent = "Delete";
    del.title = "Delete chat"; del.setAttribute("aria-label", "Delete chat: " + c.title);
    del.onclick = () => deleteChat(c.id, c.title);
    it.append(a, del); h.appendChild(it);
  }
}
function closeSideOnPhone() { if (innerWidth <= 800) document.body.classList.add("side-closed"); }
function newChat() {
  if (busy) return;
  current = null; setHash(null);
  $("msgs").innerHTML = ""; $("title").textContent = ""; $("delChat").hidden = true; showEmpty(true);
  loadHistory(); closeSideOnPhone(); ta.focus();
}
async function openChat(id) {
  if (busy) return;
  let r;
  try { r = await fetch(`/api/chats/${encodeURIComponent(id)}${DEBUG ? "?debug=1" : ""}`, {cache: "no-store"}); } catch (e) { return; }
  if (!r.ok) { newChat(); return; }
  const data = await r.json();
  current = id; setHash(id);
  $("title").textContent = data.chat.title; $("delChat").hidden = false;
  $("msgs").innerHTML = ""; showEmpty(false);
  for (const m of data.messages) m.role === "user" ? addUser(m.content) : addBot(m.content, {error: m.error, debug: m.meta});
  loadHistory(); scrollDown(); closeSideOnPhone();
}
async function deleteChat(id, title) {
  if (busy || !confirm("Delete this chat?\n\n" + title)) return;
  try { await fetch(`/api/chats/${encodeURIComponent(id)}`, {method: "DELETE"}); } catch (e) {}
  if (id === current) newChat(); else loadHistory();
}
$("newChat").onclick = newChat;
$("delChat").onclick = () => { if (current) deleteChat(current, $("title").textContent); };

// ---------- send ----------
async function send(text) {
  if (busy) return;
  busy = true; $("send").disabled = true;
  showEmpty(false); addUser(text);
  const wait = document.createElement("div"); wait.className = "bot";
  wait.innerHTML = `<div class="thinking"><span class="dot"></span><span class="st">Thinking…</span></div>`;
  $("msgs").appendChild(wait); scrollDown();
  const st = wait.querySelector(".st");
  let finished = false;
  try {
    const res = await fetch(`/api/ask${DEBUG ? "?debug=1" : ""}`, {method: "POST", headers: {"Content-Type": "application/json"},
                                                                  body: JSON.stringify({message: text, chat_id: current})});
    if (!res.ok) throw new Error(String(res.status));
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const r = await reader.read(); if (r.done) break;
      buf += dec.decode(r.value, {stream: true}); let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 1);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === "chat") {
          current = ev.chat.id; setHash(current);
          $("title").textContent = ev.chat.title; $("delChat").hidden = false; loadHistory();
        } else if (ev.type === "progress") { st.textContent = ev.text + "…"; }
        else if (ev.type === "final") { wait.remove(); addBot(ev.answer, {debug: ev.debug}); finished = true; }
        else if (ev.type === "error") { wait.remove(); addBot(ev.message, {error: true}); finished = true; }
      }
    }
  } catch (e) { /* shown below */ }
  if (!finished) { wait.remove(); addBot("I couldn't answer that just now. Please try again.", {error: true}); }
  busy = false; $("send").disabled = false; scrollDown(); loadHistory(); ta.focus();
}

const ta = $("q");
const grow = () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, innerHeight * 0.4) + "px"; };
ta.addEventListener("input", grow);
ta.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
});
$("form").onsubmit = (e) => {
  e.preventDefault();
  const v = ta.value.trim(); if (!v || busy) return;
  ta.value = ""; grow(); send(v);
};

// ---------- theme, sidebar ----------
(function () {
  const saved = store.get("theme"); if (saved) document.documentElement.dataset.theme = saved;
  $("themeBtn").onclick = () => {
    const cur = document.documentElement.dataset.theme;
    const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "light" : "dark"; store.set("theme", dark ? "light" : "dark");
  };
  if (innerWidth <= 800 || store.get("side") === "closed") document.body.classList.add("side-closed");
  $("sideBtn").onclick = () => { document.body.classList.toggle("side-closed");
    if (innerWidth > 800) store.set("side", document.body.classList.contains("side-closed") ? "closed" : "open"); };
  $("logo").onerror = () => { $("logo").hidden = true; };
})();

// ---------- start ----------
(async function () {
  await loadHistory();
  const id = location.hash.slice(1);
  if (id) await openChat(id); else showEmpty(true);
  ta.focus();
})();
</script>
</body>
</html>
