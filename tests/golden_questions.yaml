# Golden questions. Expected values come from Graphene's own output (MCP, 2026-11-14,
# Graphene demo-ready-v10, reports version 1.30.0). If a learn run changes them, update from Graphene's output, never by hand-guessing.
#
# Per case:
#   facts:   checked in `make test` against the REAL Graphene MCP result of mock.calls
#            ({tool, path, equals | length | contains})
#   expect:  checked in `make eval` against the real Claude answer
#            tools: tools that must be called; answer_contains: each item is a string, or a list
#            meaning "any of these" (case-insensitive); answer_not_contains; grounding_flags_max
#   mock:    scripted Claude for `make test` (mocked Claude, real Graphene): tool calls, then a
#            final answer that must pass the grounding check against the real results

- id: impact_zs4_iot_data
  question: "What breaks if I change ZS4_IOT_DATA?"
  facts:
    - {tool: impact, path: result.total_affected, equals: 9}
    - {tool: impact, path: result.entry_points, equals: ["FUNC:ZS4_IOT_INSERT_DATA", "FUNC:ZS4_IOT_READ_DATA"]}
    - {tool: impact, path: result.dynamic_calls, length: 1}
    - {tool: impact, path: limits, contains: "1 dynamic call touches this object or what it affects: their targets are candidates, so the impact may be larger."}
  expect:
    tools: [impact]
    answer_contains: ["9", "ZS4_IOT_INSERT_DATA", "ZS4_IOT_READ_DATA", ["RFC", "entry point"], "dynamic", "candidate"]
    grounding_flags_max: 0
  mock:
    calls:
      - {tool: impact, args: {name: ZS4_IOT_DATA}}
    answer:
      answer: |-
        Changing table ZS4_IOT_DATA affects 9 objects: 5 CDS views, 2 function modules, 1 function group and 1 class.
        - 2 entry points are reached: the RFC-enabled function modules ZS4_IOT_INSERT_DATA and ZS4_IOT_READ_DATA.
        - 1 dynamic call (from ZCL_ZS4_IOT_PROJ_DPC_EXT to ZS4_IOT_INSERT_DATA) is a candidate, not a fact, so the impact may be larger.
      claims:
        - {text: "Changing ZS4_IOT_DATA affects 9 objects.", evidence_ids: ["node:TABL:ZS4_IOT_DATA"]}
        - {text: "Entry points ZS4_IOT_INSERT_DATA and ZS4_IOT_READ_DATA are reached.", evidence_ids: ["path:TABL:ZS4_IOT_DATA > FUNC:ZS4_IOT_INSERT_DATA", "path:TABL:ZS4_IOT_DATA > FUNC:ZS4_IOT_READ_DATA"]}
        - {text: "1 dynamic call is a candidate.", evidence_ids: ["call:1"]}

- id: risk_zuzk900008
  question: "Why is ZUZK900008 high risk?"
  facts:
    - {tool: assess_transport, path: result.assessment.score, equals: 0.47}
    - {tool: assess_transport, path: result.assessment.band, equals: high}
    - {tool: assess_transport, path: result.assessment.percentile, equals: 0.8833}
    - {tool: assess_transport, path: result.assessment.percentile_label, equals: "88th percentile"}
    - {tool: assess_transport, path: result.assessment.reasons, length: 5}
    - {tool: assess_transport, path: result.assessment.comparison_version.source, equals: baseline}
  expect:
    tools: [assess_transport]
    # Graphene's own label (G-3); the app never converts 0.8833 itself (grounding flags that).
    answer_contains: ["0.47", "high", "88th percentile", "ZS4_IOT_DATA", ["ZS4_IOT_INSERT_DATA", "entry point"]]
    grounding_flags_max: 0
  mock:
    calls:
      - {tool: assess_transport, args: {transport: ZUZK900008}}
    answer:
      answer: |-
        ZUZK900008 scores 0.47, which is in the high band: 88th percentile of this system's own transport history.
        - It changes the table definition of ZS4_IOT_DATA, and 9 objects are affected.
        - It reaches 2 RFC entry points: ZS4_IOT_INSERT_DATA and ZS4_IOT_READ_DATA.
        - 1 dynamic call touches the change, so the impact may be larger.
      claims:
        - {text: "Score 0.47, band high, 88th percentile.", evidence_ids: ["node:TRKORR:ZUZK900008"]}
        - {text: "It changes the table definition of ZS4_IOT_DATA.", evidence_ids: ["node:TABL:ZS4_IOT_DATA"]}
        - {text: "It reaches entry points ZS4_IOT_INSERT_DATA and ZS4_IOT_READ_DATA.", evidence_ids: ["path:TABL:ZS4_IOT_DATA > FUNC:ZS4_IOT_INSERT_DATA", "path:TABL:ZS4_IOT_DATA > FUNC:ZS4_IOT_READ_DATA"]}

- id: risk_zuzk900006
  question: "Why is ZUZK900006 riskier than before?"
  # Graphene (G-2): the previous stored assessment has the SAME score and no changes, so the
  # answer must correct the premise instead of inventing a reason for a rise.
  facts:
    - {tool: assess_transport, path: result.assessment.score, equals: 0.345}
    - {tool: assess_transport, path: result.assessment.band, equals: moderate}
    - {tool: assess_transport, path: result.assessment.percentile_label, equals: "66th percentile"}
    - {tool: assess_transport, path: result.assessment.reasons.2.text, equals: "reaches periodic job JOB:JOB-5192e9d4d2ab in 1 hop (runs daily, 12 runs in window)"}
    - {tool: assess_transport, path: result.previous.score, equals: 0.345}
    - {tool: assess_transport, path: result.previous.band, equals: moderate}
    - {tool: assess_transport, path: result.previous.assessed_at, equals: "2026-11-12T14:44:38+00:00"}
    - {tool: assess_transport, path: result.previous.engines, equals: "impact-4, risk-3"}
    - {tool: assess_transport, path: result.changes_since_previous, length: 0}
  expect:
    tools: [assess_transport]
    answer_contains: ["0.345", "2026-11-12", ["not riskier", "unchanged", "same score", "has not changed", "hasn't changed", "no change", "nothing changed", "not changed"], "ZGR_PRICE_SYNC", "daily"]
    grounding_flags_max: 0
  mock:
    calls:
      - {tool: assess_transport, args: {transport: ZUZK900006}}
    answer:
      answer: |-
        According to Graphene, ZUZK900006 is not riskier than before: it scores 0.345 (moderate band, 66th percentile), the same score and band as its previous assessment on 2026-11-12, and Graphene lists no changes since then.
        What makes up its current risk:
        - It changes the table definition of ZGR_DISC_RULES.
        - Through program ZGR_PRICE_SYNC it reaches the periodic job JOB-5192e9d4d2ab, which runs daily, 12 runs in window.
        - The same objects were changed by 1 other request.
      claims:
        - {text: "Score 0.345, moderate band, 66th percentile.", evidence_ids: ["node:TRKORR:ZUZK900006"]}
        - {text: "The previous assessment on 2026-11-12 was also 0.345, moderate, with no changes since.", evidence_ids: ["call:1"]}
        - {text: "Reaches the daily job JOB-5192e9d4d2ab through ZGR_PRICE_SYNC (12 runs in window).", evidence_ids: ["path:PROG:ZGR_PRICE_SYNC > JOB:JOB-5192e9d4d2ab"]}

- id: not_found_zfake_table
  question: "What uses table ZFAKE_TABLE?"
  facts:
    - {tool: find_object, path: result.found, equals: false}
    - {tool: find_object, path: result.message, equals: "not found in the learned system"}
  expect:
    tools: [[find_object, impact]]
    answer_contains: ["not found in the learned system"]
    grounding_flags_max: 0
  mock:
    calls:
      - {tool: find_object, args: {name: ZFAKE_TABLE}}
    answer:
      answer: |-
        ZFAKE_TABLE is not found in the learned system, so Graphene can't say what uses it.
        That is not proof it doesn't exist in SAP: it may have been created after the last learn run, or be outside the learned scope.
      claims:
        - {text: "ZFAKE_TABLE is not found in the learned system.", evidence_ids: ["call:1"]}

- id: what_graphene_does_not_know
  question: "What does Graphene not know yet?"
  facts:
    - {tool: status, path: result.overall.stages_complete, equals: 6}
    - {tool: status, path: result.overall.stages_total, equals: 11}
    - {tool: status, path: limits, contains: "L6 Configuration is not learned yet (not started): this answer can't include it."}
  expect:
    tools: [status]
    answer_contains: ["L6", "L7", "L8", "L9", "L10", ["not started", "not learned"]]
    grounding_flags_max: 0
  mock:
    calls:
      - {tool: status, args: {}}
    answer:
      answer: |-
        Graphene has completed 6 of 11 learning stages. These are not learned yet (not started):
        - L6 Configuration, L7 Access, L8 Interfaces, L9 Runtime evidence and L10 Understanding.
        It also does not check drift (what changed in SAP since a stage learned it), and it never reads business data, ABAP source code, job variants, dump texts or job logs.
      claims:
        - {text: "6 of 11 stages are complete.", evidence_ids: ["call:1"]}
        - {text: "L6 to L10 are not started.", evidence_ids: ["call:1"]}

# Negative control (make test only): a mocked answer with an invented number and object
# must be flagged by the grounding check, not hidden.
- id: grounding_flags_invented_facts
  question: "What breaks if I change ZS4_IOT_DATA?"
  test_only: true
  expect_flags: ["12", "ZS4_IOT_DELETE_DATA", "edge:made-up"]
  mock:
    calls:
      - {tool: impact, args: {name: ZS4_IOT_DATA}}
    answer:
      answer: "Changing ZS4_IOT_DATA affects 12 objects, including ZS4_IOT_DELETE_DATA."
      claims:
        - {text: "12 objects are affected.", evidence_ids: ["edge:made-up"]}
