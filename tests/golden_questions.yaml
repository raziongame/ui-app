# Operator 2026-11-17: a pasted SAP Security Note (tests/fixtures/note_3778530_excerpt.txt, used exactly)
# and "Is this relevant to our system?". The kernel comes from the engine (system_profile, kernel
# section only): 7.53 (release 753) at patch 700; according to the note the fix is in patch 1616, so
# affected. The Web Dispatcher is not known (say how to check); the note's workaround options; no patch
# level that is neither in the engine's result nor in the note.
- id: note_3778530_relevance
  question_file: tests/fixtures/note_3778530_excerpt.txt
  question_suffix: '


    Is this relevant to our system?'
  facts:
  - {tool: system_profile, path: result.kernel.0.release, equals: '753'}
  - {tool: system_profile, path: result.kernel.0.patch_level, equals: '700'}
  - tool: system_profile
    path: result.sections
    equals: [kernel]
  - {tool: system_profile, path: evidence_ids, contains: 'node:KERNEL:ZUZ:753:700'}
  expect:
    tools: [system_profile]
    max_seconds: 20
    max_words: 140
    first_sentence_contains:
    - [this note applies, the note applies, applies to your system]
    answer_contains:
    - '7.53'
    - '700'
    - '1616'
    - according to the note
    - [update the kernel, upgrade the kernel, kernel update, kernel upgrade, update to, upgrade to, patch 1616 or higher, 1616 or higher, 1616 or later]
    answer_not_matches: ['\bpatch(?:\s+level)?\s+(?!700\b|1616\b|1617\b)\d+', '\bSP\s?(?!1616\b|1617\b)\d{3,}', '\b(?:your system|you|it)\s+(?:is|are)\s+not\s+affected\b', \\n, '(?m)^\s*#{1,6}\s', '(?m)^\s*\|', 'What I don[''’]t know', Worth checking, 7\.53 \(release 753\), '\b(?:AS ABAP|ABAP (?:stack|system)|S/4HANA|SAP_BASIS)\b']
    grounding_flags_max: 0
  mock:
    calls:
    - tool: system_profile
      args:
        sections: [kernel]
    answer:
      answer: 'Yes, this note applies to your system. Your system runs kernel 7.53 at patch level 700; according to the note, kernel 7.53 is fixed from patch 1616 onward, so your system is affected.


        Plan a kernel update to patch 1616 or higher. Until then, the note offers two workarounds:

        - an SAP Web Dispatcher in front of the ICM, updated per FAQ Note 3778788 (only if the ICM is reached exclusively through it);

        - disabling WebSocket support, which the note doesn''t recommend.'
      system_facts:
      - text: Kernel 7.53 (release 753) at patch level 700.
        results: [1]
      history_for: ''

