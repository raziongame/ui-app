# Operator 2026-11-18: two SYNTHETIC notes (not real SAP Notes; see tests/fixtures/README.md).
# Java-only: the note covers AS Java only; the engine shows an ABAP system (SAP_BASIS 751,
# S/4HANA products; SERVERCORE not found) -> "No, this one doesn't apply."
- id: synthetic_note_java_only
  question_file: tests/fixtures/SYNTHETIC_note_9900001_java_only.txt
  question_suffix: "\n\nIs this relevant to our system?"
  facts:
    - {tool: system_profile, path: result.release.sap_basis, equals: "751"}
    - {tool: system_profile, path: result.release.s4hana, equals: true}
  expect:
    tools: [system_profile]
    first_sentence_contains: [["doesn't apply", "does not apply", "not relevant", "doesn't affect", "does not affect", "isn't relevant"]]
    answer_contains: ["Java", ["ABAP", "S/4HANA"]]
    answer_not_matches: ['(?m)^\s*#{1,6}\s', '(?m)^\s*\|', 'CVSS', '\b7\.4\b', '^Yes\b', '\bapplies to your system\b',
                         '\bpatch(?:\s+level)?\s+(?!000002\b|000001\b)\d+']
    max_words: 80
    grounding_flags_max: 0
  mock:
    calls:
      - {tool: system_profile, args: {sections: [release]}}
    answer:
      answer: |-
        No, this one doesn't apply. According to the note, it only affects the AS Java (Guided Procedures), and AS ABAP and SAP S/4HANA are not affected; your system is an S/4HANA ABAP system on SAP_BASIS 751. If you also run an AS Java system, check it there.
      system_facts:
        - {text: "The system is an S/4HANA ABAP system on SAP_BASIS 751.", results: [1]}
      history_for: ""

# Depends on an unknown fact: the note applies only if an ICM profile parameter is set; profile
# parameters (configuration) aren't available -> "I can't confirm this one yet" + what to check, where.
- id: synthetic_note_needs_profile_parameter
  question_file: tests/fixtures/SYNTHETIC_note_9900002_needs_profile_parameter.txt
  question_suffix: "\n\nIs this relevant to our system?"
  facts:
    - {tool: system_profile, path: result.kernel.0.release, equals: "753"}
    - {tool: system_profile, path: result.kernel.0.patch_level, equals: "700"}
  expect:
    tools: [system_profile]
    first_sentence_contains: [["can't confirm", "cannot confirm", "can't tell", "cannot tell", "depends", "can't say", "not sure yet", "might apply", "may apply"]]
    answer_contains: ["700", "1210", "support_http2", ["RZ11", "RZ10", "profile parameter"]]
    answer_not_matches: ['(?m)^\s*#{1,6}\s', '(?m)^\s*\|', 'CVSS', '\b7\.5\b', '^Yes\b', '^No\b',
                         "\\bdoesn['’]t apply\\b", '\bpatch(?:\s+level)?\s+(?!700\b|1210\b|650\b)\d+']
    max_words: 130  # like Q10: the condition, what to check, both outcomes (eval 142508: 127 words)
    grounding_flags_max: 0
  mock:
    calls:
      - {tool: system_profile, args: {sections: [kernel]}}
    answer:
      answer: |-
        I can't confirm this one yet: it turns on a setting I don't have for your system. Your system runs kernel 7.53 (release 753) at patch level 700, below the fix in patch 1210 according to the note, but the note only applies if HTTP/2 support is enabled in the ICM.

        Check `icm/HTTP/support_http2` in RZ11. If it's TRUE, plan a kernel update to patch 1210 or higher, or (per the note) set it to FALSE and restart the ICM; if it's FALSE, nothing to do.
      system_facts:
        - {text: "Kernel 7.53 (release 753) at patch level 700.", results: [1]}
      history_for: ""

# Negative control (make test only): a mocked answer with an invented number and object
# must be flagged by the grounding check, not hidden.
# Browser testing 2026-11-17 (operator): "system monitoring?" and "please list sm21 details" got
# "I'll check / I'll look it up", 0 Graphene calls, then nothing. Monitoring questions call operations
# and pass on its stated gaps. Facts from Graphene operations (L5 v3, handshake 1.35.0, 2026-11-17).
- id: monitoring_overview
  question: "What does system monitoring show?"
  facts:
    - {tool: operations, path: result.learned, equals: true}
    - {tool: operations, path: result.jobs.runs, equals: 41}
    - {tool: operations, path: result.jobs.cancelled, equals: 0}
    - {tool: operations, path: result.dumps.total, equals: 4305}
    - {tool: operations, path: result.alerts.total, equals: 0}
    - {tool: operations, path: result.facts, contains: "CCMS: not configured"}
    - {tool: operations, path: limits, contains: "The system log (SM21) is not learned: a stated L5 gap."}
    - {tool: operations, path: evidence_ids, equals: ["run:L5:v3"]}
  expect:
    tools: [operations]
    answer_contains: ["41", "4305", ["SM21", "system log", "CCMS", "workload"]]
    # eval 2026-11-17 (76cfc6f): 112 words with a per-day breakdown and "about 288 a day"
    answer_not_matches: ["\\bI(['’]ll| will) (check|look)", "\\blet me (check|look)", "\\babout \\d", "\\bpeak", '(?m)^\s*#{1,6}\s']
    max_words: 100
    grounding_flags_max: 0
  mock:
    calls:
      - {tool: operations, args: {}}
    answer:
      answer: |-
        In the monitored window, this system had 41 background job runs (0 cancelled), 4305 short dumps and 0 alerts.
        - Which program each dump hit isn't available here; you can see that in ST22.
        - I don't have the system log for this system; you can check it in SM21. CCMS is not configured, and SAP keeps no workload aggregates on this system.
      system_facts:
        - {text: "41 background job runs, 0 cancelled.", results: [1]}
        - {text: "4305 short dumps, counted per day.", results: [1]}
        - {text: "0 alerts.", results: [1]}
        - {text: "The system log (SM21) isn't available for this system.", results: [1]}

- id: sm21_details
  question: "Show me SM21 details"
  facts:
    - {tool: operations, path: limits, contains: "The system log (SM21) is not learned: a stated L5 gap."}
  expect:
    tools: [operations]
    answer_contains: ["SM21", ["don't have", "isn't available", "not available"]]
    # the stated gap, no invented entries: no promise, no log lines (times, message ids)
    answer_not_matches: ["\\bI(['’]ll| will) (check|look)", "\\blet me (check|look)", "\\b\\d{1,2}:\\d{2}\\b"]
    first_sentence_contains: [["SM21", "system log"], ["don't have", "isn't available", "not available"]]
    max_words: 80
    grounding_flags_max: 0
  mock:
    calls:
      - {tool: operations, args: {}}
    answer:
      answer: |-
        I don't have the system log for this system; you can check its entries in SM21.
        From monitoring there are counts only: 41 job runs, 4305 short dumps and 0 alerts.
      system_facts:
        - {text: "The system log (SM21) isn't available for this system.", results: [1]}
        - {text: "41 background job runs, 4305 short dumps, 0 alerts.", results: [1]}

# Regression (make test only), browser testing 2026-11-17: a reply that only promises to look it up,
# with no Graphene call, is never shown. claude-sonnet-5-5 rejects tool_choice "any" (400), so the app
# drops that reply and asks once more with a system note; a second reply without a call is an error.
- id: no_call_reply_is_retried
  question: "please list sm21 details"
  test_only: true
  mock:
    promise_turns: 1
    calls:
      - {tool: operations, args: {}}
    answer:
      answer: "I don't have the system log for this system; you can check its entries in SM21."
      system_facts:
        - {text: "The system log (SM21) isn't available for this system.", results: [1]}

- id: no_call_twice_is_an_error
  question: "system monitoring?"
  test_only: true
  mock:
    promise_turns: 2
    calls:
      - {tool: operations, args: {}}
    answer:
      answer: "unused"
      system_facts: []

- id: grounding_flags_invented_facts
  question: "What breaks if I change ZS4_IOT_DATA?"
  test_only: true
  # Operator 2026-11-17: a statement about this system that isn't backed is rewritten once; here the
  # rewrite repeats it, so it is held back, and with nothing left the user sees the fallback.
  # 47: not in the real impact result (1.37.0 has a 12 in it, so the old "12" was backed)
  expect_flags: ["47", "ZS4_IOT_DELETE_DATA", "result 7"]
  expect_outcome: fallback
  mock:
    calls:
      - {tool: impact, args: {name: ZS4_IOT_DATA}}
    answer:
      answer: "Changing ZS4_IOT_DATA affects 47 objects, including ZS4_IOT_DELETE_DATA."
      system_facts:
        - {text: "47 objects are affected.", results: [7]}

- id: unbacked_fact_is_rewritten
  question: "What breaks if I change ZS4_IOT_DATA?"
  test_only: true
  expect_flags: ["ZS4_IOT_DELETE_DATA"]
  expect_outcome: rewritten
  mock:
    calls:
      - {tool: impact, args: {name: ZS4_IOT_DATA}}
    answers:
      - answer: "Changing table ZS4_IOT_DATA affects 9 objects, including ZS4_IOT_DELETE_DATA."
        system_facts:
          - {text: "Table ZS4_IOT_DATA has 9 dependent objects.", results: [1]}
      - answer: "Changing table ZS4_IOT_DATA affects 9 objects."
        system_facts:
          - {text: "Table ZS4_IOT_DATA has 9 dependent objects.", results: [1]}

- id: held_back_sentence
  question: "What breaks if I change ZS4_IOT_DATA?"
  test_only: true
  expect_outcome: held back
  mock:
    calls:
      - {tool: impact, args: {name: ZS4_IOT_DATA}}
    answer:
      answer: |-
        Changing table ZS4_IOT_DATA affects 9 objects.
        - 2 of them are RFC entry points: ZS4_IOT_INSERT_DATA and ZS4_IOT_READ_DATA. ZS4_IOT_PURGE_DATA is a third one.
      system_facts:
        - {text: "Table ZS4_IOT_DATA has 9 dependent objects.", results: [1]}

# Operator 2026-11-17: a general SAP question needs no engine call; general knowledge (even with
# numbers) is not checked, as long as it isn't stated as a fact about this system.
- id: general_knowledge_needs_no_call
  question: "What is transaction SM51 for?"
  test_only: true
  expect_outcome: passed
  mock:
    calls: []
    answer:
      answer: |-
        In general, **SM51** lists the application servers of an SAP system and their services (dialog, batch, update, spool).
        - From there you can open a server's work processes (SM50) or its ICM monitor (SMICM).
        - Kernel releases such as 7.93 or 9.16 show the same list.
      system_facts: []

# Regression (make test only), make eval 2026-11-14/16: Claude repeated status {} and re-ran
# assess_transport with show:1. One result per tool and object per question; a second call on the
# same object (TABL:X == X) runs only if it asks for more; status once.
- id: repeat_calls_are_skipped
  question: "What breaks if I change ZS4_IOT_DATA?"
  test_only: true
  expect_rounds: 1
  expect_trace: [impact, status, impact]
  expect_skipped: 2
  mock:
    calls:  # a list = several calls in one turn
      - [{tool: impact, args: {name: ZS4_IOT_DATA}}, {tool: status, args: {}},
         {tool: impact, args: {name: TABL:ZS4_IOT_DATA, show: 1}}, {tool: status, args: {}},
         {tool: impact, args: {name: ZS4_IOT_DATA, show: 50}}]
    answer:
      answer: "Changing ZS4_IOT_DATA affects 9 objects."
      system_facts:
        - {text: "9 objects are affected.", results: [1]}

# Operator 2026-11-16: one round of Graphene calls per question. A clear result (found, or not
# found with no similar names) ends the calls: the scripted second round is never requested.
- id: one_round_only
  question: "What uses table ZFAKE_TABLE?"
  test_only: true
  expect_rounds: 1
  expect_trace: [find_object]
  expect_skipped: 0
  mock:
    calls:
      - {tool: find_object, args: {name: ZFAKE_TABLE}}
      - {tool: status, args: {}}
    answer:
      answer: "I don't know a table called ZFAKE_TABLE in this system, and I won't guess."
      system_facts:
        - {text: "ZFAKE_TABLE is not found in this system.", results: [1]}

# Exception 1: not found WITH similar names (Graphene: ZS4_IOT_DAT -> similar_names
# [TABL:ZS4_IOT_DATA]) allows one more round; a third round is never requested.
- id: second_round_after_similar_names
  question: "What breaks if I change ZS4_IOT_DAT?"
  test_only: true
  facts:
    - {tool: find_object, path: result.found, equals: false}
    - {tool: find_object, path: result.similar_names, equals: ["TABL:ZS4_IOT_DATA"]}
  expect_rounds: 2
  expect_trace: [find_object, impact]
  expect_skipped: 0
  mock:
    calls:
      - {tool: find_object, args: {name: ZS4_IOT_DAT}}
      - {tool: impact, args: {name: ZS4_IOT_DATA}}
      - {tool: status, args: {}}
    answer:
      answer: "I don't know ZS4_IOT_DAT, but I know ZS4_IOT_DATA: changing it affects 9 objects."
      system_facts:
        - {text: "ZS4_IOT_DAT is not found; similar name ZS4_IOT_DATA.", results: [1]}
        - {text: "Changing ZS4_IOT_DATA affects 9 objects.", results: [2]}

# Exception 2: ambiguous (several objects for one name) allows one more round. This learned system
# has no ambiguous name, so the test returns two real find_object objects for ZS4_IOT_X.
- id: second_round_after_ambiguous
  question: "What is ZS4_IOT_X?"
  test_only: true
  ambiguous_from: [ZS4_IOT_FG, ZS4_IOT_INSERT_DATA]
  expect_rounds: 2
  expect_trace: [find_object, impact]
  expect_skipped: 0
  mock:
    calls:
      - {tool: find_object, args: {name: ZS4_IOT_X}}
      - {tool: impact, args: {name: ZS4_IOT_FG}}
      - {tool: status, args: {}}
    answer:
      answer: "ZS4_IOT_X matches 2 objects: ZS4_IOT_FG and ZS4_IOT_INSERT_DATA."
      system_facts:
        - {text: "2 objects match: ZS4_IOT_FG and ZS4_IOT_INSERT_DATA.", results: [1]}
