    - {tool: system_profile, path: result.components.items.0.support_package, equals: null}
    - {tool: system_profile, path: result.components.items.0.support_package_note, equals: "not learned (the name isn't in CVERS)"}
    - {tool: system_profile, path: limits, contains: "sp_level is CVERS.EXTRELEASE exactly as SAP stores it, in 10 or 4 digits; sp_level_note gives the SP level as System → Status shows it (4 digits)."}
    - {tool: system_profile, path: result.l0.last_run, equals: "2026-11-05T14:26:30.307039+00:00"}
    - {tool: system_profile, path: result.components.showing, equals: "showing 1 of 162"}
