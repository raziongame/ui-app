# White-label skins (operator 2026-11-17). Same engine behind both; only these values differ.
# path: URL path of the skin. product_name_allowed: may answers and the page name the engine's
# product name? (partner: never). Colours are CSS values; text colours checked for WCAG AA
# contrast (tests/test_brand.py).

partner:
  path: /
  name: "Cloudbox · SAP Assistant"
  # Text logo only (operator 2026-11-17): "Cloudbox" in graphite, "· SAP Assistant" in a lighter weight.
  wordmark: ["Cloudbox", "· SAP Assistant"]
  tagline: "Ask about your SAP system"
  logo_text: null
  logo_image: null
  byline: null
  product_name_allowed: false
  # Warm theme (operator 2026-11-17): graphite #1F2937, amber #F59E0B (buttons, with graphite text;
  # never amber text on a light background), deep amber #B45309 (links), background #FAF7F2 / #111827.
  colors:
    light:
      bg: "#FAF7F2"
      surface: "#FFFFFF"        # white cards: deep amber links 5.0:1 (on beige #F1EBE1 only 4.24:1)
      text: "#1F2937"           # graphite 13.7:1
      muted: "#57534E"          # 7.1:1
      heading: "#1F2937"
      header_bg: "#FAF7F2"
      header_text: "#1F2937"
      button_bg: "#F59E0B"      # amber, graphite label 6.83:1
      button_text: "#1F2937"
      link: "#B45309"           # deep amber 4.70:1 on the page
      tick: "#B45309"           # marks: amber itself is 2.01:1 on #FAF7F2, so deep amber (4.70:1)
      highlight: "#FDF3E1"      # amber tint (hover)
      highlight_strong: "#F59E0B"
      border: "#E4DCCF"
    dark:
      bg: "#111827"
      surface: "#1C2433"
      text: "#F3F4F6"           # 16.1:1
      muted: "#A8A29E"          # 7.0:1
      heading: "#F59E0B"        # amber 8.3:1
      header_bg: "#0D1320"
      header_text: "#F3F4F6"
      button_bg: "#F59E0B"
      button_text: "#111827"    # 8.3:1
      link: "#FBBF24"           # 9.3:1 on cards
      tick: "#F59E0B"
      highlight: "#2A2416"
      highlight_strong: "#F59E0B"
      border: "#2E3746"

direct:
  path: /direct
  name: "Graphene"
  tagline: "Ask about your SAP system"
  logo_text: "G"
  # Operator puts the file at ~/ui-app/static/brand/niraamai-logo.png; until then the text mark shows.
  logo_image: "niraamai-logo.png"
  byline: "by NiraamAI"
  product_name_allowed: true
  # NiraamAI logo colours: navy #003858 (header, headings), ocean blue #2A82B4 (buttons, links),
  # teal #1298B0 (status, ticks), sky cyan #4AC2E0 (hover, highlights).
  colors:
    light:
      bg: "#FFFFFF"
      surface: "#F2F7FA"
      text: "#12232F"
      muted: "#4A5B68"
      heading: "#003858"
      header_bg: "#003858"
      header_text: "#FFFFFF"
      button_bg: "#2A82B4"      # white bold large text on it: 4.24:1 (AA large)
      button_text: "#FFFFFF"
      link: "#1F6A96"           # ocean blue, darkened for small text: 5.90:1 (AA); #2A82B4 is 4.24:1
      tick: "#1298B0"           # teal, non-text marks: 3.42:1 (>= 3:1)
      highlight: "#E3F5FA"      # sky cyan tint (hover); cyan itself is the border/underline
      highlight_strong: "#4AC2E0"
      border: "#C9DCE6"
    dark:
      bg: "#0B1C2A"
      surface: "#132A3D"
      text: "#E8F1F7"           # 15.1:1
      muted: "#9FB3C3"          # 8.0:1
      heading: "#4AC2E0"        # cyan 8.3:1
      header_bg: "#071521"
      header_text: "#E8F1F7"
      button_bg: "#4AC2E0"
      button_text: "#0B1C2A"    # 8.3:1
      link: "#4AC2E0"
      tick: "#1298B0"           # teal 5.06:1
      highlight: "#17344A"
      highlight_strong: "#4AC2E0"
      border: "#24435A"
